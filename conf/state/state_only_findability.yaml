defaults:
  - _self_

hydra:
  output_subdir: null
  job:
    chdir: false

directory_path: "data/sample_2026-05-21_08-57"

files: ["geo_transparenzportal-hamburg_03.rdf"]

file_filter:
  extensions: [".rdf"]

  include_patterns: []

  exclude_patterns: []

output_dir: "run_outputs/"
run_output_dir_suffix: ""
run_output_enabled: true

dataset_path: "dataset.csv"

language: "de"

pipeline:
  load_data: true
  static_analysis: true
  quality_validation: true
  semantic_analysis: true

llm:
  model: "anthropic/claude-sonnet-4.5"
  temperature: 0.0
  max_tokens: 50000

logging:
  level: "DEBUG"
  verbose: true

quality:
  max_workers: 1

  dimension_whitelist: ["findability"]

  dimension_weights:
    findability: 1
    accessibility: 1
    reusability: 1
    expressiveness: 1

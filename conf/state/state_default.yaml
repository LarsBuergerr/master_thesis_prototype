# AgentState configuration
# This file defines the initial state for the agent pipeline

defaults:
  - _self_

# Disable Hydra output subdirectory (.hydra folder)
hydra:
  output_subdir: null
  job:
    chdir: false

# Directory paths
directory_path: "data/sample_2026-05-18_09-12"

# Files to process
# If empty: process all files matching extensions in directory_path
# If filled: process only these specific files
# files: ["non_geo_land-schleswig-holstein.rdf"]

# Examples:
# - "geo_open-data-brandenburg.rdf"

# File filtering (only used if files list is empty)
file_filter:
  extensions: [".rdf"]

  # Include patterns: process only files matching these (filename starts with)
  include_patterns: []
    # - "geo_"
    # - "non_geo_"

  # Exclude patterns: skip files matching these (filename starts with)
  exclude_patterns: []
    # - "test_"

# Output directory for results
output_dir: "run_outputs/"
run_output_dir_suffix: ""
run_output_enabled: true

# Language configuration
language: "de" # Options: "de", "en"

# LLM Model configuration
llm:
  # Master switch for the expressiveness LLM agent. Must be true to spend
  # tokens; when false, expressiveness indicators report NOT_APPLICABLE.
  enabled: false
  model: "anthropic/claude-sonnet-4.5" # Any OpenRouter model id
  temperature: 0.0
  max_tokens: 10000

# Logging configuration
logging:
  level: "DEBUG" # Options: "DEBUG", "INFO", "WARNING", "ERROR", "CRITICAL"
  verbose: true

# Quality scoring configuration
quality:
  max_workers: 1

  # Status -> Punkte-Abbildung (optional). Fehlt dieser Block, werden die
  # Roh-Scores der Indikatoren unverändert verwendet (rückwärtskompatibel).
  #   - pass_score / partial_score / fail_score: Punkte je Status
  #   - fail_score DARF negativ sein (aktive Bestrafung von Fehlschlägen)
  #   - allow_partial: false -> jeder PARTIAL wird als FAIL gewertet (streng)
  # Gilt voll nur für ternäre Indikatoren (PASS/PARTIAL/FAIL). Gestufte/
  # kontinuierliche Indikatoren (GRADED=True: expr_*, acc_machine_readable_access,
  # acc_format_congruence, acc_*_url_response, acc_distribution_model,
  # reuse_contact) behalten ihren Roh-Score für PASS/PARTIAL; fail_score greift
  # bei ihnen nur bei Status FAIL.
  scoring:
    pass_score: 1.0
    partial_score: 0.0
    fail_score: 0.0
    allow_partial: true
    # Pro-Indikator-Overrides (überschreiben die globalen Werte oben)
    overrides:
      # find_keywords_count nutzt im Code 0.7 als partial — hier explizit halten:
      # find_keywords_count: { partial_score: 0.7 }
      # Beispiel: fehlende Lizenz aktiv bestrafen:
      # reuse_license: { fail_score: -0.5 }

  # Optional dimension whitelist (default: all dimensions)
  # If specified, only these dimensions will be validated
  dimension_whitelist: ["findability", "accessibility", "reusability"]

  # Optional indicator blacklist (default: no indicators excluded)
  # If specified, these indicators will be skipped
  # indicator_blacklist: ["reuse_contributor_id"]

  # indicator_whitelist: []

  # Optional custom weights per dimension (default for all: 1.0)
  # Example: expressiveness=30%, findability=10%
  dimension_weights:
    findability: 1
    accessibility: 1
    reusability: 1
    expressiveness: 1

  # Optional custom weights per indicator id (default: indicator.weight)
  # indicator_weights:
  #   find_keywords_count: 1.5
  #   find_theme_valid: 1.0

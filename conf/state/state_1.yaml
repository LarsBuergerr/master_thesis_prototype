# AgentState configuration
# This file defines the initial state for the agent pipeline

defaults:
  - _self_

# Directory paths
directory_path: "../data/sample_2026-05-18_09-12/"
metadata_path: "non_geo_land-schleswig-holstein.rdf"
dataset_path: "dataset.csv"

# Language configuration
language: "de" # Options: "de", "en"

# Pipeline configuration
pipeline:
  load_data: true
  static_analysis: true
  quality_validation: true
  semantic_analysis: true

# LLM Model configuration
llm:
  model: "anthropic/claude-sonnet-4.5" # Options from LLMModel enum
  temperature: 0.0
  max_tokens: 50000

# Logging configuration
logging:
  level: "DEBUG" # Options: "DEBUG", "INFO", "WARNING", "ERROR", "CRITICAL"
  verbose: true

# Quality scoring configuration
quality:
  max_workers: 4
  # Optional custom weights per dimension (default for all: 1.0)
  # Example: expressiveness=30%, findability=10%
  dimension_weights:
    findability: 0.1
    accessibility: 0.3
    reusability: 0.3
    expressiveness: 0.3

  # Optional custom weights per indicator id (default: indicator.weight)
  indicator_weights:
    find_keywords_count: 1.5
    find_theme_valid: 1.0

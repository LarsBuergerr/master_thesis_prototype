defaults:
  - _self_

hydra:
  output_subdir: null
  job:
    chdir: false

directory_path: "data"

files: ["perfect_example_01_updated.rdf"]

file_filter:
  extensions: [".rdf"]

  include_patterns: []

  exclude_patterns: []

output_dir: "run_outputs/"
run_output_dir_suffix: "perfect_example_01_updated"
run_output_enabled: true

dataset_path: "dataset.csv"

language: "de"

pipeline:
  load_data: true
  static_analysis: true
  quality_validation: true
  semantic_analysis: true

llm:
  model: "anthropic/claude-sonnet-4.5"
  temperature: 0.0
  max_tokens: 50000

logging:
  level: "DEBUG"
  verbose: true

quality:
  max_workers: 1

  dimension_whitelist: []

  # Optional indicator blacklist (default: no indicators excluded)
  # indicator_blacklist: []

  indicator_whitelist: []

  dimension_weights:
    findability: 1
    accessibility: 1
    reusability: 1
    expressiveness: 1

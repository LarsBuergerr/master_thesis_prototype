# One-command start for the quality analyzer web stack:
#   docker compose up --build
# Frontend:  http://localhost:3000   (nginx, proxies /api to the backend)
# Backend:   http://localhost:8000   (FastAPI, direct access optional)
#
# The OPENROUTER_API_KEY is read from the repo-root .env file (compose loads it
# automatically). Without a key the expressiveness indicators report
# not_applicable — everything else works.

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANALYZER_DB_PATH: /data/analyzer.db
    volumes:
      - analyzer-data:/data
    # Lets a container reach a llama.cpp server on the host via
    # http://host.docker.internal:8080/v1 (llm provider "local").
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  analyzer-data:

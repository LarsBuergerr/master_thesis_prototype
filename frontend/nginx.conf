server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Match the backend upload guard (ANALYZER_MAX_UPLOAD_BYTES, default 25 MB).
    client_max_body_size 30m;

    # Same rewrite as the Vite dev proxy: /api/jobs -> backend /jobs.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Analysis jobs run async, but uploads of many files can take a moment.
        proxy_read_timeout 300s;
    }

    # SPA fallback.
    location / {
        try_files $uri /index.html;
    }
}
